# Production-shaped stack per the plan's infra section: nginx | backend
# (Daphne/ASGI — required for Channels/KDS, not plain Gunicorn/WSGI) |
# celery-worker | celery-beat | frontend (Next.js standalone) | postgres |
# redis. Point DNS/TLS at nginx; see nginx/nginx.conf for the HTTP-only
# starting config (certbot/TLS needs a real domain plugged in).
#
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# Requires a backend/.env (see backend/.env.example) with production
# SECRET_KEY/DB credentials/ALLOWED_HOSTS, and frontend build args below
# pointed at the public URL nginx will serve.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-pos_restro_hotel}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    env_file: ./backend/.env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      # Opt-in row-level-security enforcement (see backend/entrypoint.sh
      # and docs/rls.md) — unset by default, in which case this service
      # keeps connecting as the table owner, same as today. celery-worker
      # and celery-beat deliberately stay on the owner connection: no
      # Celery task yet sets the per-tenant RLS context they'd need.
      RUNTIME_DB_USER: ${RUNTIME_DB_USER:-}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:-}
      RLS_RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:-}
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-worker:
    build: ./backend
    command: celery -A config worker -l info
    env_file: ./backend/.env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build: ./backend
    command: celery -A config beat -l info
    env_file: ./backend/.env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api}
        NEXT_PUBLIC_WS_BASE_URL: ${PUBLIC_WS_BASE_URL:-/ws}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/static:ro
      - media_data:/media:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
